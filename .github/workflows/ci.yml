# Tests and lint for every branch and pull request.
# Also called by release.yml, so nothing publishes without passing this first.

name: CI

on:
  push:
    branches-ignore:
      - main   # main is covered by the CI call inside release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 wheels bundle Qt itself but not these system libraries, and the
      # offscreen platform plugin still fails to load without them.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install package
        run: pip install -e ".[test]"

      # conftest.py sets QT_QPA_PLATFORM=offscreen before PySide6 is imported.
      - name: Run tests
        run: pytest

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ruff is pinned so a new release cannot fail the build on its own.
      - name: Install tools
        run: pip install "ruff==0.15.20" "bandit[toml]"

      - name: Check lint rules
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Security scan
        run: bandit -c pyproject.toml -r src/
